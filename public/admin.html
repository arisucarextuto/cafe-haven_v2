<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理画面｜Café Haven</title><link rel="stylesheet" href="/assets/style.css"></head><body><header class="site-header"><a class="brand" href="/">☕ Café Haven</a><nav><a href="/calculator.html">料金計算</a><button id="logout" class="nav-button">ログアウト</button></nav></header><main class="page-main"><section class="page-heading compact"><p class="eyebrow">ADMINISTRATION</p><h1>管理画面</h1><p id="admin-label">管理者専用</p></section><div class="admin-tabs"><button class="button" data-tab="products">商品管理</button><button class="button secondary" data-tab="users">従業員アカウント管理</button></div><section id="products-section" class="admin-section"><h2>商品管理</h2><p class="muted">価格・回復効果・掲載状態を編集できます。</p><form id="new-product-form" class="admin-form"><h3>商品を追加</h3><label>区分<select name="category"><option>食べ物</option><option>飲み物</option><option>食べ物・飲み物</option></select></label><label>商品名<input name="name" required></label><label>単価<input name="price" type="number" min="0" required></label><label>回復効果<input name="recovery_effect" required placeholder="例：空腹 30% / 水分 30%"></label><button class="button" type="submit">商品を追加</button></form><div id="admin-products" class="admin-list">読み込み中…</div></section><section id="users-section" class="admin-section hidden"><h2>従業員アカウント管理</h2><form id="new-user-form" class="admin-form"><h3>従業員を追加</h3><label>ユーザー名<input name="username" required minlength="3"></label><label>表示名<input name="display_name" required></label><label>初期パスワード（12文字以上）<input name="password" type="password" required minlength="12"></label><label>権限<select name="role"><option value="employee">従業員</option><option value="admin">管理者</option></select></label><button class="button" type="submit">アカウントを作成</button></form><div id="admin-users" class="admin-list">読み込み中…</div></section><p id="admin-message" class="form-message" role="status"></p></main><script src="/assets/admin.js"></script></body></html>
