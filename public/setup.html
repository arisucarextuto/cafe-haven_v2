<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>初期管理者設定｜Café Haven</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><main class="login-wrap"><form id="setup-form" class="login-card"><p class="eyebrow">FIRST-TIME SETUP</p><h1>初期管理者設定</h1><p>管理者が未作成の場合のみ利用できます。設定後、このページは使えなくなります。</p><label>管理者ユーザー名<input name="username" required minlength="3" autocomplete="username"></label><label>表示名<input name="display_name" required></label><label>パスワード（12文字以上）<input name="password" type="password" required minlength="12" autocomplete="new-password"></label><button class="button full" type="submit">管理者を作成</button><p id="setup-message" class="form-message" role="status"></p></form></main><script src="/assets/setup.js"></script></body></html>
