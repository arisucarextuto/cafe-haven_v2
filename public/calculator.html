<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>料金計算｜Café Haven</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><header class="site-header"><a class="brand" href="/">☕ Café Haven</a><nav><a href="/">ホーム</a><a href="/menu.html">メニュー</a><button id="logout" class="nav-button">ログアウト</button></nav></header>
<main class="page-main"><section class="page-heading compact"><p class="eyebrow">STAFF TOOL</p><h1>料金計算</h1><p id="staff-label">従業員専用ページ</p></section>
<div class="calc-toolbar"><label class="search-label">商品を検索 <input id="search-products" placeholder="商品名で検索…"></label><button id="reset" class="button secondary">数量をリセット</button></div>
<div id="calculator-list" class="calc-list"><p>商品を読み込み中…</p></div>
<section class="total-card"><div><span>合計金額</span><strong id="grand-total">¥0</strong></div><label>お客様名（任意）<input id="customer-name" placeholder="お客様名"></label><label>請求メッセージ<textarea id="billing-message" rows="3" readonly></textarea></label><div class="actions"><button id="copy-billing" class="button">請求文をコピー</button><button id="copy-total" class="button secondary">合計金額のみコピー</button></div><p id="calc-message" class="form-message" role="status"></p></section>
<section id="admin-panel" class="admin-panel hidden"><h2>管理者メニュー</h2><p>商品や従業員の設定を管理できます。</p><a class="button" href="/admin.html">管理画面を開く</a></section>
</main><footer><a class="brand" href="/">☕ Café Haven</a><small>従業員専用ツール</small></footer><script src="/assets/calculator.js"></script></body></html>
